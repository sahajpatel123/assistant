<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Christin - OS Interface</title>
    <style>
        :root {
            --glow: #00d4ff;
            --dim-glow: rgba(0, 212, 255, 0.3);
            --bg: #050a0f;
        }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
            border: 2px solid var(--glow);
            box-sizing: border-box;
            position: relative;
        }
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--dim-glow);
            padding: 20px;
            background: linear-gradient(180deg, rgba(0, 212, 255, 0.05) 0%, transparent 100%);
        }
        .main-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .status-circle {
            width: 400px;
            height: 400px;
            border: 2px solid var(--dim-glow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotate 20s linear infinite;
        }
        .inner-circle {
            width: 300px;
            height: 300px;
            border: 4px dashed var(--glow);
            border-radius: 50%;
            animation: rotate-rev 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-rev {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .core {
            position: absolute;
            font-size: 1.5rem;
            color: var(--glow);
            text-shadow: 0 0 15px var(--glow);
        }
        .stats {
            position: absolute;
            bottom: 40px;
            left: 340px;
            font-size: 0.8rem;
            color: var(--dim-glow);
            width: calc(100% - 380px);
        }
        .glitch-text {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .telemetry {
            margin-top: 20px;
        }
        .bar-container {
            width: 100%;
            background: rgba(255,255,255,0.1);
            height: 10px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--glow);
            width: 0%;
            transition: width 0.5s ease;
        }
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: rgba(0, 212, 255, 0.1);
            padding: 5px;
            border-top: 1px solid var(--glow);
            border-bottom: 1px solid var(--glow);
            margin-top: 10px;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 15s linear infinite;
            color: var(--glow);
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2 style="color: var(--glow)">System Status</h2>
            <p>Ears: <span style="color: #0f0">Active</span></p>
            <p>Displays: <span style="color: #0f0">Dual Detected</span></p>
            <p>Owner: <span style="color: var(--glow)">Sir</span></p>
            <hr style="border: 0; border-top: 1px solid var(--dim-glow)">
            
            <div class="telemetry">
                <p>CPU LOAD: <span id="cpu-val">0%</span></p>
                <div class="bar-container"><div class="bar-fill" id="cpu-bar"></div></div>
                
                <p>MEMORY: <span id="ram-val">0%</span></p>
                <div class="bar-container"><div class="bar-fill" id="ram-bar"></div></div>
            </div>

            <div id="logs" style="font-size: 0.7rem; color: #aaa; margin-top: 20px;">
                > System Online<br>
                > Waiting for voice input...
            </div>
        </div>
        <div class="main-view">
            <div class="status-circle"></div>
            <div class="inner-circle"></div>
            <div class="core glitch-text">CHRISTIN</div>
        </div>
        <div class="stats">
            COORDINATES: 40.7128° N, 74.0060° W | UPTIME: 99.9% | SECURITY: LEVEL 5
            <div class="ticker-wrap">
                <div class="ticker" id="news-ticker">INTEL FEED: All systems operational. Monitoring global frequencies...</div>
            </div>
        </div>
    </div>

    <script>
        async function fetchTelemetry() {
            try {
                const response = await fetch('/api/telemetry');
                const data = await response.json();
                document.getElementById('cpu-val').innerText = data.cpu + '%';
                document.getElementById('cpu-bar').style.width = data.cpu + '%';
                
                document.getElementById('ram-val').innerText = data.ram + '%';
                document.getElementById('ram-bar').style.width = data.ram + '%';
            } catch (e) {
                console.error("Telemetry error", e);
            }
        }

        async function fetchNews() {
            try {
                const response = await fetch('/api/news');
                const data = await response.json();
                if(data && data.length > 0) {
                    const headlines = data.map(n => n.headline).join(' | ');
                    document.getElementById('news-ticker').innerText = "INTEL FEED: " + headlines + " | ";
                }
            } catch (e) {
                console.error("News error", e);
            }
        }

        setInterval(fetchTelemetry, 2000);
        fetchNews();
        setInterval(fetchNews, 60000);
    </script>
</body>
</html>
