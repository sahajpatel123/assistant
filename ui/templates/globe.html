<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christin - Global Intel Matrix</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #00ffcc; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        
        .marker {
            width: 14px;
            height: 14px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
            cursor: pointer;
            transition: transform 0.2s;
            animation: pulse 1.5s infinite alternate;
        }
        .marker:hover { transform: scale(1.5); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc; }
            100% { box-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc; }
        }

        #video-card {
            position: absolute;
            display: none;
            width: 400px;
            height: 250px;
            background: rgba(0, 20, 20, 0.9);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5);
            z-index: 100;
            backdrop-filter: blur(10px);
            padding: 10px;
            box-sizing: border-box;
            transition: opacity 0.3s ease;
            opacity: 0;
            pointer-events: auto;
        }
        
        #video-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -10px;
            margin-top: -10px;
            border-width: 10px 10px 10px 0;
            border-style: solid;
            border-color: transparent #00ffcc transparent transparent;
            display: block;
            width: 0;
        }
        
        #video-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            padding-bottom: 5px;
        }
        
        iframe {
            width: 100%;
            height: calc(100% - 30px);
            border: none;
            border-radius: 4px;
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            color: #00ffcc;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="globeViz"></div>
    <div id="video-card">
        <span class="close-btn" onclick="closeCard()">×</span>
        <h3 id="card-title">Live Intel Stream</h3>
        <iframe id="news-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <script>
        const videoCard = document.getElementById('video-card');
        const iframe = document.getElementById('news-iframe');
        const cardTitle = document.getElementById('card-title');

        function closeCard() {
            videoCard.style.opacity = 0;
            setTimeout(() => {
                videoCard.style.display = 'none';
                iframe.src = '';
            }, 300);
        }

        document.addEventListener('click', (e) => {
            if(videoCard.style.display === 'block' && !videoCard.contains(e.target) && !e.target.classList.contains('marker')) {
                closeCard();
            }
        });

        // Initialize the 3D Holographic Globe
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
            .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png');

        // Set initial orbital rotation for the Jarvis aesthetic
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 1.0;
        world.pointOfView({ altitude: 2.2 });

        fetch('/api/news')
            .then(res => res.json())
            .then(newsData => {
                world.htmlElementsData(newsData)
                .htmlElement(d => {
                    const el = document.createElement('div');
                    el.className = 'marker';
                    
                    el.onclick = (e) => {
                        e.stopPropagation();
                        // Stop rotation when viewing
                        world.controls().autoRotate = false;
                        
                        // Set live news URL (using Sky News live as generic for demonstration)
                        iframe.src = 'https://www.youtube.com/embed/9Auq9mYxFEE?autoplay=1&mute=0';
                        cardTitle.innerText = `[ LIVE ] ${d.source || 'Global Intel'}`;
                        
                        // Position card
                        videoCard.style.display = 'block';
                        videoCard.style.left = Math.min(e.clientX + 30, window.innerWidth - 420) + 'px';
                        videoCard.style.top = Math.max(0, Math.min(e.clientY - 125, window.innerHeight - 270)) + 'px';
                        
                        setTimeout(() => { videoCard.style.opacity = 1; }, 50);
                    };
                    return el;
                });
            });
    </script>
</body>
</html>
