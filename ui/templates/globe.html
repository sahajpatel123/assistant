<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christin - Global Intel Matrix</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #00ffcc; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        #globeViz { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 20, 20, 0.85);
            border: 1px solid #00ffcc;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            max-width: 320px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        h1 { margin-top: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #00ffcc; padding-bottom: 10px; }
        .news-item { margin-bottom: 15px; }
        .region { font-weight: bold; font-size: 0.75rem; color: #aaa; text-transform: uppercase; }
        .headline { font-size: 0.95rem; margin-top: 4px; line-height: 1.3; }
        .headline::before { content: "> "; color: #00ffcc; }
    </style>
    <script src="//unpkg.com/globe.gl"></script>
</head>
<body>
    <div id="overlay">
        <h1>Global Intel</h1>
        <div id="news-container">
            Syncing telemetry...
        </div>
    </div>
    <div id="globeViz"></div>

    <script>
        fetch('/api/news')
            .then(res => res.json())
            .then(newsData => {
                // Populate the tactical side panel
                const container = document.getElementById('news-container');
                container.innerHTML = '';
                newsData.forEach(item => {
                    container.innerHTML += `
                        <div class="news-item">
                            <div class="region">[ ${item.region} ]</div>
                            <div class="headline">${item.headline}</div>
                        </div>
                    `;
                });

                // Initialize the 3D Holographic Globe
                const world = Globe()
                    (document.getElementById('globeViz'))
                    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-dark.jpg')
                    .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                    .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                    .htmlElementsData(newsData)
                    .htmlElement(d => {
                        const el = document.createElement('div');
                        el.innerHTML = `<div style="color: #00ffcc; font-size: 24px; cursor: pointer; text-shadow: 0 0 10px #00ffcc;">🎯</div>`;
                        
                        // Interactive pointers on the globe
                        el.onclick = () => {
                            // Synthesize speech locally in browser when clicked
                            const msg = new SpeechSynthesisUtterance(d.headline);
                            // Try to grab a premium Siri-like voice if available
                            const voices = window.speechSynthesis.getVoices();
                            msg.voice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Daniel')) || voices[0];
                            window.speechSynthesis.speak(msg);
                            alert(`INTERCEPTED COMMS - ${d.region}:\n\n${d.headline}`);
                        };
                        return el;
                    });

                // Set initial orbital rotation for the Jarvis aesthetic
                world.controls().autoRotate = true;
                world.controls().autoRotateSpeed = 1.2;
                
                // Adjust camera altitude to frame the globe nicely
                world.pointOfView({ altitude: 2.5 });
            });
    </script>
</body>
</html>
