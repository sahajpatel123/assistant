<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christin - Intelligence Grid</title>
    <style>
        body { 
            margin: 0; padding: 20px; 
            background-color: #050a0f; 
            color: #00ffcc; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            box-sizing: border-box;
            display: flex;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }
        .left-col {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            padding-right: 20px;
            border-right: 1px solid rgba(0, 212, 255, 0.3);
        }
        .right-col {
            flex: 1;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
            margin-top: 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            padding-bottom: 10px;
        }
        .video-container {
            flex: 1;
            background: #000;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .news-grid {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 10px;
        }
        .news-grid::-webkit-scrollbar { width: 5px; }
        .news-grid::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 5px; }
        .news-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .news-card:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: translateX(5px);
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        .source {
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .headline {
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="left-col">
        <h1>Live Feed</h1>
        <div class="video-container">
            <!-- Live News Feed (Al Jazeera or Sky News as generic) -->
            <!-- Controls enabled, autoplay=1, mute=1 by default -->
            <iframe src="https://www.youtube.com/embed/9Auq9mYxFEE?autoplay=1&mute=1&controls=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
    <div class="right-col">
        <h1>Global Headlines</h1>
        <div class="news-grid" id="news-grid">
            <div style="color: #aaa;">Syncing telemetry...</div>
        </div>
    </div>

    <script>
        fetch('/api/news')
            .then(res => res.json())
            .then(newsData => {
                const grid = document.getElementById('news-grid');
                grid.innerHTML = '';
                newsData.forEach(item => {
                    grid.innerHTML += `
                        <div class="news-card">
                            <div class="source">[ ${item.source || 'Intel Desk'} ]</div>
                            <div class="headline">> ${item.headline}</div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
